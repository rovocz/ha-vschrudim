reset_history:
  name: Reset historie vodoměru
  description: >-
    Smaže veškerou dosud dovezenou historii (dlouhodobé statistiky)
    pro tento účet VS Chrudim a při nejbližší aktualizaci ji
    naimportuje znovu od začátku. Bez zadané entity se resetují
    všechny nakonfigurované účty VS Chrudim najednou.
  fields:
    entity_id:
      name: Entita vodoměru
      description: >-
        Nepovinné - omezí reset jen na účet, kterému tahle entita
        patří. Ponech prázdné, chceš-li resetovat úplně vše.
      required: false
      selector:
        entity:
          integration: vschrudim
