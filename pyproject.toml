[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-vschrudim"
version = "0.4.0"
description = "Home Assistant integration for Vodárenská společnost Chrudim"
requires-python = ">=3.9"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
