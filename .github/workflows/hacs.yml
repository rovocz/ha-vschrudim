name: HACS validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration
